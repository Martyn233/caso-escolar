<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WENACOMPITA - Portal Escolar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Elementos decorativos de fondo */
        .glow-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            z-index: 0;
        }

        .glow-circle-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            bottom: -150px;
            right: -100px;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            padding: 3rem 2rem;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 550px;
            width: 90%;
            animation: fadeIn 0.8s ease-out forwards;
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem auto;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b5cf6;
            animation: float 3s ease-in-out infinite;
        }

        .welcome-title {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            line-height: 1.2;
            color: #f8fafc;
        }

        .highlight {
            background: linear-gradient(to right, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-message {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            color: #ffffff;
            background: linear-gradient(to right, #6366f1, #8b5cf6);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
            background: linear-gradient(to right, #4f46e5, #7c3aed);
        }

        .btn-secondary {
            color: #e2e8f0;
            background: transparent;
            border: 2px solid rgba(148, 163, 184, 0.3);
        }

        .btn-secondary:hover {
            border-color: #8b5cf6;
            color: #ffffff;
            background: rgba(139, 92, 246, 0.1);
            transform: translateY(-3px);
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Diseño responsivo */
        @media (max-width: 600px) {
            .welcome-title { font-size: 2.2rem; }
            .welcome-message { font-size: 1rem; }
            .button-group { flex-direction: column; width: 100%; }
            .btn { width: 100%; }
            .container { padding: 2.5rem 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Luces de fondo -->
    <div class="glow-circle"></div>
    <div class="glow-circle-2"></div>

    <div class="container">
        <!-- Icono de birrete académico -->
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
        </div>

        <h1 class="welcome-title">ESCUELA DEL <span class="highlight">SWAGSWAGSWAG</span></h1>

        
        <div class="button-group">
            <a href="/login" class="btn btn-primary">ENTRA A LA SESH</a>
            <a href="/registro" class="btn btn-secondary">CENTRO DE SWAGLUMNOS</a>
        </div>
    </div>

</body>
</html>
